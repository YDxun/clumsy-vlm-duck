tasks:
- id: search_ball_across_rooms
  instruction_zh: 穿过门洞，在另一个房间找到球并靠近
  instruction_en: Pass through the doorway, find the ball in the other room, and approach
    it.
  max_duration_s: 90
  success_hold_s: 0.75
  restartable: true
  robot_spawn:
    xy:
    - -1.8
    - 0
    yaw_deg: 0
    random_xy_radius_m: 0.12
    random_yaw_deg: 10
  success:
    all:
    - type: distance_xy_le
      body: trunk_base
      target: ball
      distance_m: 0.4
  failure:
    any:
    - type: outside_bounds_aabb
      min_xy:
      - -2.9
      - -2.4
      max_xy:
      - 2.9
      - 2.4
    - type: fallen_for_s
      body: trunk_base
      seconds: 5.0
- id: go_to_beacon
  instruction_zh: 根据语义目标前往黄色信标
  instruction_en: Navigate to the yellow beacon.
  max_duration_s: 45
  success_hold_s: 0.75
  restartable: true
  robot_spawn:
    xy:
    - -1.8
    - 0
    yaw_deg: 0
    random_xy_radius_m: 0.12
    random_yaw_deg: 10
  success:
    all:
    - type: distance_xy_le
      body: trunk_base
      target: beacon_target
      distance_m: 0.35
  failure:
    any:
    - type: outside_bounds_aabb
      min_xy:
      - -2.9
      - -2.4
      max_xy:
      - 2.9
      - 2.4
    - type: fallen_for_s
      body: trunk_base
      seconds: 5.0
- id: retrieve_ball
  instruction_zh: 找到球并用踢或推把它带到绿色区域
  instruction_en: Find the ball and kick/push it into the green zone.
  max_duration_s: 75
  success_hold_s: 0.75
  restartable: true
  robot_spawn:
    xy:
    - -1.8
    - 0
    yaw_deg: 0
    random_xy_radius_m: 0.12
    random_yaw_deg: 10
  success:
    all:
    - type: body_in_zone
      body: ball
      zone: zone_green
      radius_m: 0.3
  failure:
    any:
    - type: outside_bounds_aabb
      min_xy:
      - -2.9
      - -2.4
      max_xy:
      - 2.9
      - 2.4
    - type: fallen_for_s
      body: trunk_base
      seconds: 5.0
