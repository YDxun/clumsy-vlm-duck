<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duck VLM</title><style>body{margin:0;background:#071019;color:#e8f2fb;font:13px ui-monospace,Consolas,monospace}header{padding:10px 16px;border-bottom:1px solid #263949;color:#54c8ff;font-size:17px}main{display:grid;grid-template-columns:1fr 390px;gap:10px;padding:10px}.panel{border:1px solid #263949;border-radius:9px;background:#0d1822;overflow:hidden}h2{margin:0;padding:7px 10px;color:#8fa8bd;font-size:12px;border-bottom:1px solid #263949}img{display:block;width:100%;background:#000}.head{height:230px;object-fit:contain}.body{padding:10px;display:grid;gap:8px}.row{display:flex;gap:6px;flex-wrap:wrap}.grow{flex:1}input,select,button{background:#09111a;color:#e8f2fb;border:1px solid #32495d;border-radius:6px;padding:7px}button{cursor:pointer}button:hover{border-color:#54c8ff}.primary{background:#a64b18}.stop{background:#5c1b27}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.token{padding:8px 2px;font-weight:700}.hot{border-color:#ff8a3d;color:#ffc093}.status{padding:10px;display:grid;grid-template-columns:100px 1fr;gap:5px}.k{color:#8fa8bd}.bad{color:#ff5f72}.hist{height:170px;overflow:auto;padding:8px}.hist div{border-bottom:1px solid #1d2c39;padding:4px 0}@media(max-width:900px){main{grid-template-columns:1fr}.head{height:180px}}</style></head><body><header>DUCK VLM HARNESS <span id="link" style="font-size:11px;color:#ff5f72">OFFLINE</span></header><main><section class="panel"><h2>MAIN VIEW</h2><img id="main" src="/api/vlm/snapshot?view=main"><h2>HEAD CAMERA</h2><img id="head" class="head" src="/api/vlm/snapshot?view=head"></section><section class="panel"><h2>EPISODE</h2><div class="body"><input id="task" value="find the ball, approach and kick it"><div class="row"><span>TARGET</span><input id="target" value="ball" style="width:100px"><select id="mode"><option value="dry_run">DRY RUN</option><option value="zero_shot">ZERO SHOT</option><option value="finetuned">LORA</option></select><label><input id="record" type="checkbox" checked>record</label></div><div class="row"><span>SCENE</span><select id="scene"></select><span id="scene-msg" class="k"></span></div><div class="row"><button id="start" class="primary">START</button><button id="pause">PAUSE</button><button id="resume">RESUME</button><button id="step">STEP</button><button id="stop" class="stop">STOP</button></div><div id="plugins" class="row"></div></div><h2>HUMAN / GUI ACTION</h2><div class="body"><div class="grid" id="tokens"></div></div><h2>STATUS</h2><div class="status"><span class="k">phase</span><span id="phase">-</span><span class="k">step</span><span id="stepv">-</span><span class="k">action</span><span id="action">-</span><span class="k">result</span><span id="result">-</span><span class="k">latency</span><span id="latency">-</span><span class="k">model</span><span id="model">-</span><span class="k">recording</span><span id="recording">-</span><span class="k">session</span><span id="session">-</span><span class="k">error</span><span id="error" class="bad">-</span></div><h2>RECENT RESULTS</h2><div id="history" class="hist"></div></section></main><script>const $=x=>document.getElementById(x),proto=location.protocol==='https:'?'wss':'ws';let ws,ready=false;const plugins={proprioception:true,action_memory:true,subgoal:true,affordance:true,recovery:true,fall_recovery:true,human_takeover:true,search_align:true,extra_views:false},names={proprioception:'proprio',action_memory:'memory',subgoal:'subgoal',affordance:'affordance',recovery:'recovery',fall_recovery:'fall reset',human_takeover:'human',search_align:'search align',extra_views:'extra views'},tokens=['FWD','BACK','STRAFE_L','STRAFE_R','TURN_L','TURN_R','STOP','STAND','LOOK_DOWN','HEAD_CENTER','KICK_L','KICK_R','ROLL','DANCE','DONE'];function send(o){if(ready)ws.send(JSON.stringify(o))}function post(p,b){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json())}function drawPlugins(){let e=$('plugins');e.innerHTML='';for(const k in plugins){let l=document.createElement('label');l.innerHTML='<input type="checkbox" data-p="'+k+'" '+(plugins[k]?'checked':'')+'>'+names[k];e.appendChild(l)}e.querySelectorAll('input').forEach(x=>x.onchange=()=>{plugins[x.dataset.p]=x.checked;send({type:'vlm_config',config:{plugins}})})}function drawTokens(){let e=$('tokens');tokens.forEach(t=>{let b=document.createElement('button');b.className='token';b.dataset.token=t;b.textContent=t;b.onclick=()=>human(t);e.appendChild(b)})}function state(s){if(!s)return;$('phase').textContent=s.phase||'-';$('stepv').textContent=(s.step||0)+'/'+(s.max_steps||0);$('action').textContent=s.last_action||'-';$('result').textContent=s.last_result||'-';$('latency').textContent=s.latency_ms==null?'-':s.latency_ms+'ms';$('model').textContent=(s.mode||'-')+'/'+(s.model||'-');$('recording').textContent=s.recording?'ON':'OFF';$('session').textContent=s.session_dir||'-';$('error').textContent=s.last_error||'-';$('history').innerHTML='';(s.recent_results||[]).slice().reverse().forEach(r=>{let d=document.createElement('div');d.textContent='#'+r.sim_time.toFixed(2)+' '+r.token+' '+(r.ok?'ok':'fail')+' '+r.note;$('history').appendChild(d)});document.querySelectorAll('.token').forEach(b=>b.classList.toggle('hot',b.dataset.token===s.last_action))}async function control(a){let b={action:a};if(a==='start'){b.task=$('task').value;b.target=$('target').value;b.record=$('record').checked;b.auto_run=true;b.config={vlm:{mode:$('mode').value},plugins};send({type:'vlm_config',config:b.config})}if(a==='step'){b.task=$('task').value;b.target=$('target').value;b.record=$('record').checked;b.config={vlm:{mode:$('mode').value},plugins}}state(await post('/api/vlm/control',b))}async function human(t){state(await post('/api/vlm/human',{token:t}))}async function loadScenes(){try{let r=await fetch("/api/scenes").then(x=>x.json()),el=$("scene");el.innerHTML="";(r.scenes||[]).forEach(s=>{let o=document.createElement("option");o.value=s.id;o.textContent=s.id;el.appendChild(o)});if(r.current)el.value=r.current;el.onchange=async()=>{let sid=el.value;$("scene-msg").textContent="restarting...";await post("/api/scenes/select",{scene_id:sid,restart:true});setTimeout(()=>location.reload(),9000)}}catch(e){$("scene-msg").textContent=String(e)}} function connect(){ws=new WebSocket(proto+'://'+location.host+'/ws');ws.binaryType='blob';ws.onopen=()=>{ready=true;$('link').textContent='ONLINE';$('link').style.color='#52d273';send({type:'vlm_config',config:{plugins}})};ws.onclose=()=>{ready=false;$('link').textContent='OFFLINE';$('link').style.color='#ff5f72';setTimeout(connect,1200)};ws.onmessage=async e=>{if(typeof e.data==='string'){try{let o=JSON.parse(e.data);if(o.type==='state'&&o.vlm)state(o.vlm)}catch(_){}}else{let b=new Uint8Array(await e.data.arrayBuffer()),tag=b[0],u=URL.createObjectURL(new Blob([b.slice(1)],{type:'image/jpeg'})),i=tag===1?$('main'):$('head'),old=i.src;i.onload=()=>{if(old.startsWith('blob:'))URL.revokeObjectURL(old)};i.src=u}}}function key(e){if(['INPUT','SELECT'].includes(e.target.tagName))return;let m={w:'FWD',s:'BACK',a:'STRAFE_L',d:'STRAFE_R',q:'TURN_L',e:'TURN_R',z:'KICK_L',x:'KICK_R',r:'ROLL',c:'DANCE',' ':'STOP'};let t=m[e.key.toLowerCase()];if(t){human(t);e.preventDefault()}}drawPlugins();drawTokens();loadScenes();$('start').onclick=()=>control('start');$('pause').onclick=()=>control('pause');$('resume').onclick=()=>control('resume');$('step').onclick=()=>control('step');$('stop').onclick=()=>control('stop');addEventListener('keydown',key);connect();</script></body></html>
